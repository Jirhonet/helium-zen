name: Linux build stage

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      final:
        type: boolean
        default: false
    outputs:
      status:
        description: Whether compilation completed or needs another job
        value: ${{ jobs.stage.outputs.status }}

permissions:
  contents: read

env:
  ARCH: x86_64

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      status: ${{ steps.build.outputs.status }}
    steps:
      # The platform tooling expects its root here and the browser in this subdir.
      # Never initialize its helium-chromium submodule: build this fork instead.
      - name: Check out pinned Linux build tooling
        uses: actions/checkout@v6
        with:
          repository: imputnet/helium-linux
          ref: b154afccb44729359c816754c7741efb3cb8f497
          persist-credentials: false

      - name: Check out this fork at the requested commit
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: helium-chromium
          persist-credentials: false

      - name: Configure fork build
        run: python3 helium-chromium/.github/scripts/configure-linux-build.py

      - name: Free runner disk space
        run: bash .github/scripts/cleanup.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build builder image
        if: inputs.stage == 'prepare'
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/build.Dockerfile
          tags: chromium-builder:trixie-slim
          outputs: type=docker,dest=/tmp/chromium-builder.tar
          cache-from: type=gha,scope=helium-zen-builder
          cache-to: type=gha,mode=max,scope=helium-zen-builder

      - name: Save builder image for compilation jobs
        if: inputs.stage == 'prepare'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-x86_64
          path: /tmp/chromium-builder.tar
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Prepare or resume compilation
        if: inputs.stage != 'package'
        id: build
        uses: ./.github/actions/build
        with:
          prepare-only: ${{ inputs.stage == 'prepare' }}
          final: ${{ inputs.final }}

      - name: Download completed build
        if: inputs.stage == 'package'
        uses: actions/download-artifact@v4
        with:
          name: build-cache-x86_64
          path: .github/cache/

      - name: Restore completed build
        if: inputs.stage == 'package'
        run: bash .github/scripts/import-cache.sh

      - name: Package unsigned Linux binaries
        if: inputs.stage == 'package'
        env:
          MAKE_DEB: '1'
        run: bash package/docker-package.sh

      - name: Upload downloadable builds
        if: inputs.stage == 'package'
        uses: actions/upload-artifact@v4
        with:
          name: helium-zen-linux-x86_64-${{ github.sha }}
          path: |
            build/release/*.AppImage
            build/release/*_linux.tar.xz
            build/release/*.deb
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

      - name: Summarize build
        if: inputs.stage == 'package'
        run: |
          {
            echo '### Helium Zen Linux x86_64'
            echo 'Download the AppImage, tar.xz, and deb from this run’s Artifacts section.'
            echo 'These are unsigned personal builds.'
            printf '\nSource commit: `%s`\n' "$GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
